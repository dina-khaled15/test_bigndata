services:

  # =========================================================
  # HDFS - NameNode
  # =========================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: maritime-namenode
    restart: "no"

    ports:
      - "9870:9870"
      - "9000:9000"

    volumes:
      - namenode_data:/hadoop/dfs/name
      - maritime-ais-download:/data

    environment:
      - CLUSTER_NAME=maritime

    env_file:
      - ./.env

    networks:
      - maritime-network


  # =========================================================
  # HDFS - DataNode
  # =========================================================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: maritime-datanode
    restart: "no"

    depends_on:
      - namenode

    ports:
      - "9864:9864"

    volumes:
      - datanode_data:/hadoop/dfs/data

    environment:
      - SERVICE_PRECONDITION=namenode:9870

    env_file:
      - ./.env

    networks:
      - maritime-network


  # =========================================================
  # SPARK MASTER
  # =========================================================
  spark-master:
    image: apache/spark:3.5.6
    container_name: maritime-spark-master
    restart: "no"

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080

    environment:
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY}

    ports:
      - "7077:7077"
      - "8080:8080"

    volumes:
      - ./spark:/opt/spark-apps
      - ./scripts:/opt/scripts

    networks:
      - maritime-network


  # =========================================================
  # SPARK WORKER
  # =========================================================
  spark-worker:
    image: apache/spark:3.5.6
    container_name: maritime-spark-worker
    restart: "no"

    depends_on:
      - spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    ports:
      - "8081:8081"

    volumes:
      - ./spark:/opt/spark-apps

    networks:
      - maritime-network


  # =========================================================
  # KAFKA
  # =========================================================
  kafka:
    image: apache/kafka:3.9.0
    container_name: maritime-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    networks:
      - maritime-network


  # =========================================================
  # KAFKA UI
  # =========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: maritime-kafka-ui
    restart: unless-stopped

    ports:
      - "8083:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: maritime-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka

    networks:
      - maritime-network


  # =========================================================
  # AIS STREAM PRODUCER
  # =========================================================
  ais-producer:
    build:
      context: ./streaming

    container_name: maritime-ais-producer

    depends_on:
      - kafka

    environment:
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

    networks:
      - maritime-network


  # =========================================================
  # POSTGRES - AIRFLOW METADATA DATABASE
  # =========================================================
  postgres:
    image: postgres:16
    container_name: maritime-postgres
    restart: "no"

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - maritime-network


  # =========================================================
  # AIRFLOW INIT
  # =========================================================
  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile

    container_name: maritime-airflow-init
    restart: "no"

    depends_on:
      - postgres

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

      # Spark jobs available to Airflow
      - ./spark:/opt/spark-apps

      # Allow Airflow to communicate with Docker
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - bash
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username admin \
          --password admin \
          --firstname Maritime \
          --lastname Admin \
          --role Admin \
          --email admin@maritime.local || true

    networks:
      - maritime-network


  # =========================================================
  # AIRFLOW WEBSERVER
  # =========================================================
  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: maritime-airflow-webserver
    restart: "no"

    depends_on:
      - postgres
      - airflow-init

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

      # Spark scripts
      - ./spark:/opt/spark-apps

      # Docker access
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      - "8082:8080"

    command: webserver

    networks:
      - maritime-network


  # =========================================================
  # AIRFLOW SCHEDULER
  # =========================================================
  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: maritime-airflow-scheduler
    restart: "no"

    depends_on:
      - postgres
      - airflow-init

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

      # Spark scripts
      - ./spark:/opt/spark-apps

      # Docker access
      - /var/run/docker.sock:/var/run/docker.sock

    command: scheduler

    networks:
      - maritime-network


# =========================================================
# VOLUMES
# =========================================================
volumes:

  namenode_data:

  datanode_data:

  postgres_data:

  kafka-data:

  maritime-ais-download:
    external: true


# =========================================================
# NETWORK
# =========================================================
networks:

  maritime-network:
    driver: bridge